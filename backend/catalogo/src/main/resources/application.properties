spring.application.name=huertohogar-catalogo
server.port=${PORT:8080}

# MySQL es el perfil por defecto. Configurar variables fuera del repositorio.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_catalogo}
spring.datasource.username=${DB_USER:huerto_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Credencial compartida con Usuarios solo para el MVP local.
# Nunca fijar este secreto en el repositorio. Reemplazar por firmas asimetricas al desplegar varios servicios.
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.issuer=${JWT_ISSUER:huertohogar-usuarios}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:}
