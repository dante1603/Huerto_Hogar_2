spring.application.name=huertohogar-detalle-boleta
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_detalle_boleta}
spring.datasource.username=${DB_USER:huerto_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.issuer=${JWT_ISSUER:huertohogar-usuarios}
servicios.boletas.base-url=${BOLETAS_BASE_URL:http://localhost:8083}
servicios.pedidos.base-url=${PEDIDOS_BASE_URL:http://localhost:8082}
springdoc.swagger-ui.path=/swagger-ui.html
