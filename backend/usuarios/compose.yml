services:
  mysql:
    image: mysql:8.4
    container_name: huertohogar-usuarios-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-huertohogar_usuarios}
      MYSQL_USER: ${DB_USER:-huerto_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - usuarios_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  usuarios_mysql_data:
