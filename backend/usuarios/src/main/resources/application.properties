spring.application.name=huertohogar-usuarios
server.port=${SERVER_PORT:8080}

# Configuracion real: MySQL. Credenciales por variables de entorno, NO subir .env.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_usuarios}
spring.datasource.username=${DB_USER:huerto_app}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Documentacion de API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
