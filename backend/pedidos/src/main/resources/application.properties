spring.application.name=huertohogar-pedidos
server.port=${PORT:8082}
# Hasta el corte final MySQL sigue sin validarse; para pruebas usar perfil demo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_pedidos}
spring.datasource.username=${DB_USER:huerto_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.issuer=${JWT_ISSUER:huertohogar-usuarios}
servicios.productos.base-url=${PRODUCTOS_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:}
springdoc.swagger-ui.path=/swagger-ui.html