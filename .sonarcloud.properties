# Analisis automatico SonarQube Cloud.
# No desactivar reglas ni excepcionar vulnerabilidades de codigo de producto.
sonar.sourceEncoding=UTF-8
sonar.sources=.
# Tests Java y scripts de simulacion HTTP: no son endpoints desplegados.
sonar.tests=scripts,backend/catalogo/src/test,backend/usuarios/src/test,backend/pedidos/src/test,backend/boleta/src/test,backend/detalle-boleta/src/test
# Sonar no debe indexar los mismos ficheros a la vez como source y test.
sonar.exclusions=scripts/**,backend/**/src/test/**,**/target/**,**/node_modules/**,**/dist/**
