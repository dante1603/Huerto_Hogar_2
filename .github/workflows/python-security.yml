name: Local tooling security tests

on:
  pull_request:
    paths:
      - 'scripts/manage_local_services.py'
      - 'scripts/verify_react_mysql_ep3.py'
      - 'scripts/test_manage_services.py'
      - 'scripts/test_verify_react_security.py'
      - '.github/workflows/python-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile security-sensitive scripts
        run: python -m py_compile scripts/manage_local_services.py scripts/verify_react_mysql_ep3.py
      - name: Run isolated security regression tests (no MySQL required)
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
