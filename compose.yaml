services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: huertohogar_usuarios
      MYSQL_USER: huerto_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - huerto_mysql_data:/var/lib/mysql
      - ./infra/mysql/01-create-catalog.sql:/docker-entrypoint-initdb.d/01-create-catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  huerto_mysql_data:
